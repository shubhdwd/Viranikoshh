# Viranikosh CI
# - backend  : typecheck + prisma client generation
# - frontend : typecheck + lint + production build
# - e2e      : Playwright suite against a throwaway Postgres + mock AI
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  frontend:
    name: Frontend (typecheck / lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viranikosh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Local throwaway DB (both point at the same service — no pgBouncer in CI).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viranikosh_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/viranikosh_test
      JWT_SECRET: ci-test-secret-not-used-in-production
      JWT_EXPIRES_IN: 7d
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Apply schema to test DB
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Playwright's webServer config boots Vite (5173) and the backend (5000)
      # itself, pointing the AI providers at the in-process mock (global-setup.ts).
      - name: Run Playwright E2E
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
